name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: 'true'
      NEXT_PUBLIC_GITHUB_PAGES: 'true'
      NEXT_PUBLIC_API_MOCKING: enabled
      NEXT_PUBLIC_DEMO_MODE: 'true'
      NEXT_PUBLIC_APP_URL: https://mikesherif.github.io/PMFK
      NEXT_PUBLIC_API_URL: https://mikesherif.github.io/PMFK/api
      NEXT_PUBLIC_BASE_PATH: /PMFK
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-pages-export.mjs
      - run: pnpm build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
